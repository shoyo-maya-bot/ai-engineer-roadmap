site_name: AI エンジニア学習ロードマップ（Python）
site_description: 業務開発の経験がある人が、Python・機械学習・LLM・RAG・エージェント・運用までを順に学び、AI システムを作って本番で動かせるようになる教材
site_url: https://shoyo-maya-bot.github.io/ai-engineer-roadmap/
repo_url: https://github.com/shoyo-maya-bot/ai-engineer-roadmap
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: ダークモード}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: ライトモード}
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
  - attr_list
plugins:
  - search:
      lang: ja
  # 本文の版を extra.versions の 1 か所にまとめ、{{ versions.xxx }} で参照する.
  # {{ }} を書くページだけで展開する（先頭に render_macros: true）. Jinja などの {{ }} を含むコード例を壊さないため
  - macros:
      render_by_default: false
      on_undefined: strict
      on_error_fail: true
# 本文に書く版. 演習のコード（examples/）で実際に使う版と同じにする.
# scripts/check_versions.py（CI）が examples/pyproject.toml・examples/.python-version・examples/uv.lock・
# .github/workflows の uv の版と照合し、本文に直接書いた版（「Python 3.12」など）を検出する.
extra:
  versions:
    python: "3.12"
    uv: "0.8.17"
    pytest: "9.1.1"
    ruff: "0.16.10"
validation:
  links:
    not_found: warn
    anchors: warn
nav:
  - はじめに: index.md
  - 学び方: guide.md
  - 基礎:
      - 01 Python と基礎: 01-python/index.md
      - 02 AI のための数学: 02-math/index.md
      - 03 データエンジニアリング: 03-data/index.md
  - 機械学習・深層学習:
      - 04 機械学習: 04-ml/index.md
      - 05 ディープラーニング: 05-deep-learning/index.md
  - LLM 応用:
      - 06 LLM の基礎: 06-llm-basics/index.md
      - 07 プロンプトと API:
          - 07-prompt-api/index.md
          - 07-1 プロンプトの設計: 07-prompt-api/07-1-prompt-design.md
          - 07-2 構造化出力とスキーマ検証: 07-prompt-api/07-2-structured-output.md
          - 07-3 関数呼び出しとツール使用: 07-prompt-api/07-3-tool-use.md
          - 07-4 費用の最適化: 07-prompt-api/07-4-cost.md
          - 07-5 小さな評価セットを最初に作る: 07-prompt-api/07-5-eval-set.md
          - 解答:
              - 07-1 解答: 07-prompt-api/answers/07-1.md
              - 07-2 解答: 07-prompt-api/answers/07-2.md
              - 07-3 解答: 07-prompt-api/answers/07-3.md
              - 07-4 解答: 07-prompt-api/answers/07-4.md
              - 07-5 解答: 07-prompt-api/answers/07-5.md
      - 08 RAG とベクトルデータベース:
          - 08-rag/index.md
          - 08-1 文書の取り込み: 08-rag/08-1-ingest.md
          - 08-2 チャンク分割とエンベディング: 08-rag/08-2-chunk-embedding.md
          - 08-3 ベクトル検索・ハイブリッド検索・並べ替え: 08-rag/08-3-search.md
          - 08-4 RAG の評価: 08-rag/08-4-rag-eval.md
          - 解答:
              - 08-1 解答: 08-rag/answers/08-1.md
              - 08-2 解答: 08-rag/answers/08-2.md
              - 08-3 解答: 08-rag/answers/08-3.md
              - 08-4 解答: 08-rag/answers/08-4.md
      - 09 ファインチューニングと最適化: 09-finetuning/index.md
      - 10 AI エージェント:
          - 10-agents/index.md
          - 10-1 エージェントのループとワークフローの違い: 10-agents/10-1-loop-vs-workflow.md
          - 10-2 メモリと状態の管理: 10-agents/10-2-memory-state.md
          - 10-3 MCP でツールをつなぐ: 10-agents/10-3-mcp.md
          - 10-4 人の承認・回数と費用の上限: 10-agents/10-4-approval-limits.md
          - 10-5 AI コーディング支援を開発で使う: 10-agents/10-5-ai-coding.md
          - 解答:
              - 10-1 解答: 10-agents/answers/10-1.md
              - 10-2 解答: 10-agents/answers/10-2.md
              - 10-3 解答: 10-agents/answers/10-3.md
              - 10-4 解答: 10-agents/answers/10-4.md
              - 10-5 解答: 10-agents/answers/10-5.md
  - 安全・運用・実践:
      - 11 AI の安全と評価: 11-safety/index.md
      - 12 MLOps とデプロイ: 12-mlops/index.md
      - 13 実践プロジェクト: 13-project/index.md
