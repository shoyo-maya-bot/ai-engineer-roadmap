name: ci

on:
  pull_request:
  push:
    branches: [main]
  # 週 1 回も検査する（公開はしない。失敗したら Issue を起票）.
  # 外部リンクの検査（links）は外部のサイトの都合で結果が変わるので、定期実行と手動実行だけで動かす（push・PR では動かさない）
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR に新しいコミットが来たら、古い検査は取り消す（PR だけ）.
# main への push と定期実行は取り消さない（公開の途中で止めない）. イベントごとに分けて、定期実行が push の待ちを押し出さないようにする
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 教材の検査とサイトの生成. main への push では、生成したサイトを公開用に渡す（公開は deploy）
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # 版とハッシュは constraints.txt で固定する（deps-lock.yml が作る）
      - name: install
        run: pip install --require-hashes -r constraints.txt
      - name: check_chapters（章の型・解答・nav・章の一覧・禁止語）
        run: python scripts/check_chapters.py
      - name: check_code_quotes（引用したコードと examples/ の実物）
        run: python scripts/check_code_quotes.py
      - name: check_python_examples（説明用のコード例の構文）
        run: python scripts/check_python_examples.py
      - name: check_versions（本文の版と実物）
        run: python scripts/check_versions.py
      - name: check_docs_match（README などの説明と実物）
        run: python scripts/check_docs_match.py
      - name: build (strict — broken links and config errors fail)
        run: mkdocs build --strict
      # {{ versions.* }} が展開されずに残っていないか（render_macros の付け忘れ）
      - name: macros rendered
        run: |
          if grep -rl --include=*.html '{{ *versions\.' site; then
            echo "::error::{{ versions.* }} が展開されていないページがあります（先頭に render_macros: true が必要）"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: site

  # 検査スクリプトのテストと、演習のコード（examples/）のテスト. どちらも LLM やネットワークを使わない
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: |
          pip install --require-hashes -r constraints.txt
          pip install "uv==0.8.17"
      - name: 検査スクリプトのテスト
        run: python -m pytest
      - name: 演習のコードのテスト（uv.lock の版で）
        working-directory: examples
        run: |
          uv sync --locked
          uv run --frozen pytest

  # 執筆者には Windows の人もいる. 検査スクリプトと演習のコードが Windows でも動くこと
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1" # パイプに日本語を出しても落ちないように（Windows の既定の文字コード対策）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: |
          pip install --require-hashes -r constraints.txt
          pip install "uv==0.8.17"
      - name: 検査スクリプトのテスト
        run: python -m pytest
      - name: 検査
        run: |
          python scripts/check_chapters.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/check_code_quotes.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/check_python_examples.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/check_versions.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/check_docs_match.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: 演習のコードのテスト
        working-directory: examples
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit 1 }
          uv run --frozen pytest
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # 静的解析と書式（ruff の版は examples/uv.lock のもの. 設定は ruff.toml と examples/pyproject.toml）
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "uv==0.8.17"
      - run: uv sync --locked --project examples
      - run: uv run --frozen --project examples ruff check --output-format=github .
      - run: uv run --frozen --project examples ruff format --check .

  # SAST（bandit）と、依存の脆弱性（pip-audit. サイトの生成と検査・演習のコードの両方）
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "bandit==1.8.6" "pip-audit==2.9.0" "uv==0.8.17"
      - name: SAST（bandit. 中以上）
        run: bandit -q -r scripts examples/src -ll
      - name: 依存の脆弱性（サイトの生成と検査. constraints.txt の版で）
        run: pip-audit -r constraints.txt --progress-spinner off
      - name: 依存の脆弱性（演習のコード. uv.lock の版で）
        run: |
          uv export --project examples --frozen --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/examples-requirements.txt"
          pip-audit -r "$RUNNER_TEMP/examples-requirements.txt" --progress-spinner off

  # 外部リンクの検査（週 1 回の定期実行と手動実行だけ. push・PR では動かさない）.
  # 切れていたら失敗し、report-scheduled-failure が Issue を起票する（Issue の本文に切れたリンクの一覧を入れる）
  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      report: ${{ steps.links.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: pip install --require-hashes -r constraints.txt
      # {{ versions.* }} を展開した後の URL を見るため、組み立てたサイトの HTML を検査する
      - name: build
        run: mkdocs build --strict
      - name: check_links
        id: links
        run: |
          set +e
          python scripts/check_links.py site --report links-report.md
          rc=$?
          cat links-report.md >> "$GITHUB_STEP_SUMMARY"
          delim="LINKS_$(python -c 'import secrets; print(secrets.token_hex(8))')"
          { echo "report<<${delim}"; head -c 50000 links-report.md; echo; echo "${delim}"; } >> "$GITHUB_OUTPUT"
          exit $rc

  # 公開は検査（security を含む）がすべて通ったときだけ. tests/test_workflow.py が needs を確かめる
  # （links は push では動かないので needs に入れない. 入れると公開が止まる）
  deploy:
    if: github.event_name == 'push'
    needs: [docs, tests, windows, lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 公開は 1 つずつ順番に. 実行中の公開は取り消さず最後まで（古い内容が新しい内容を上書きしない）
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # 週 1 回の検査が失敗したら Issue を起票する（同じタイトルの Issue が開いていれば、コメントを追記する）.
  # 外部リンクだけが切れていたときは、別のタイトルの Issue にする（教材の検査の失敗と混ぜない）
  report-scheduled-failure:
    if: failure() && github.event_name == 'schedule'
    needs: [docs, tests, windows, lint, security, links]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # 教材の中の URL を含むので、式で run: に埋め込まず環境変数で渡す
      LINKS_REPORT: ${{ needs.links.outputs.report }}
      LINKS_RESULT: ${{ needs.links.result }}
      RESULTS: >-
        docs=${{ needs.docs.result }} / tests=${{ needs.tests.result }} / windows=${{ needs.windows.result }}
        / lint=${{ needs.lint.result }} / security=${{ needs.security.result }}
      OTHERS_FAILED: >-
        ${{ needs.docs.result == 'failure' || needs.tests.result == 'failure' || needs.windows.result == 'failure'
        || needs.lint.result == 'failure' || needs.security.result == 'failure' }}
    steps:
      - name: 外部リンク切れの Issue を起票または追記
        if: env.LINKS_RESULT == 'failure'
        env:
          TITLE: "外部リンクが切れています（週 1 回の検査）"
        run: |
          body="$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "週 1 回の定期実行で、教材の外部リンクに切れているものが見つかりました（$(date -u +%Y-%m-%d)）。" \
            "- 実行結果: ${RUN_URL}" \
            "${LINKS_REPORT}" \
            "リンク先を公式の新しい URL に直してください（手元で: mkdocs build --strict && python scripts/check_links.py site）。「確認できない」リンクは、ブラウザで開けるかを確かめてください。")"
          number="$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "追記: #$number"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
      - name: 検査の失敗の Issue を起票または追記
        if: env.OTHERS_FAILED == 'true'
        env:
          TITLE: "週 1 回の検査（ci）が失敗しました"
        run: |
          body="$(printf '%s\n\n%s\n%s\n\n%s' \
            "週 1 回の定期実行で、教材の検査が失敗しました（$(date -u +%Y-%m-%d)）。" \
            "- 実行結果: ${RUN_URL}" \
            "- 結果: ${RESULTS}" \
            "コードを変えていなくても、依存の脆弱性（security）や、実行環境の更新で失敗することがあります。実行結果のログを見て直してください。")"
          number="$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "追記: #$number"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
